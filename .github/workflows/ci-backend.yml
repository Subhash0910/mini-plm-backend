name: Backend CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'mini-plm-backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mini-plm-backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mini_plm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'eclipse-temurin'
        cache: maven

    - name: Build with Maven
      working-directory: mini-plm-backend
      run: ./mvnw clean install -DskipTests

    - name: Run Tests
      working-directory: mini-plm-backend
      run: ./mvnw test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mini_plm_test
        SPRING_DATASOURCE_USERNAME: test_user
        SPRING_DATASOURCE_PASSWORD: test_password
        SPRING_PROFILES_ACTIVE: test

    - name: Generate Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: JUnit Test Results
        path: 'mini-plm-backend/target/surefire-reports/TEST-*.xml'
        reporter: 'java-junit'

    - name: SonarQube Scan
      working-directory: mini-plm-backend
      run: |
        ./mvnw clean org.jacoco:jacoco-maven-plugin:prepare-agent install org.jacoco:jacoco-maven-plugin:report
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./mini-plm-backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mini-plm-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/mini-plm-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
