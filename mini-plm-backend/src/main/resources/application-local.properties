# =========================
# Spring Application Configuration
# =========================
spring.application.name=mini-plm-backend
server.port=8080


# =========================
# Database (Neon PostgreSQL)
# =========================
spring.datasource.url=jdbc:postgresql://ep-blue-thunder-a4j7k942-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_TdsyrKLFh1c4

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# =========================
# JPA / Hibernate Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =========================
# JWT Configuration (CORRECTED - app.jwt.* prefix)
# =========================
app.jwt.secret=your-super-secret-key-min-64-chars-change-in-production-abc123def456ghi789jkl012mno345pqr
app.jwt.expiration=86400000

# =========================
# CORS Configuration
# =========================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# =========================
# Logging Configuration
# =========================
logging.level.root=INFO
logging.level.com.sam.mini_plm_backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/mini-plm-backend.log
logging.file.max-size=10MB
logging.file.max-history=30

# =========================
# Server Configuration
# =========================
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# =========================
# Application-Specific Settings
# =========================
app.name=Mini PLM Backend
app.version=1.0.0
