version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mini-plm-db
    environment:
      POSTGRES_USER: ${DB_USER:-plm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plm_password}
      POSTGRES_DB: ${DB_NAME:-mini_plm_db}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mini-plm-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - plm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plm_user} -d ${DB_NAME:-mini_plm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mini-plm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@miniplm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - plm-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Mini PLM Backend Application
  backend:
    build:
      context: .
      dockerfile: mini-plm-backend/Dockerfile
    container_name: mini-plm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mini_plm_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-plm_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-plm_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-local}
      APP_JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-12345678}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  plm-network:
    driver: bridge
